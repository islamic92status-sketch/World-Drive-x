import * as THREE from 'three';
const $=id=>document.getElementById(id);let S={coins:250,owned:[0],sel:0,stars:{},max:1,snd:true,last:0};try{Object.assign(S,JSON.parse(localStorage.getItem('wdx2000v2')))}catch(e){}const save=()=>localStorage.setItem('wdx2000v2',JSON.stringify(S));const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)};

const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x9cc4ee,60,420);const cam=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,900);const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(ren.domElement);addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
const hemi=new THREE.HemisphereLight(0xcfe6ff,0x6a7a4a,.8);scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff1d6,1);scene.add(sun,sun.target);
const grass=new THREE.Mesh(new THREE.PlaneGeometry(900,2000),new THREE.MeshLambertMaterial({color:0x8a9a58}));grass.rotation.x=-Math.PI/2;grass.position.set(0,-.06,-600);scene.add(grass);
const road=new THREE.Mesh(new THREE.BoxGeometry(36,.1,1800),new THREE.MeshLambertMaterial({color:0xffffff}));road.position.set(0,-.05,-600);scene.add(road);
let curEnv='';function applyEnv(lvl){const e=ENVS[Math.floor((lvl-1)/(2000/12))%ENVS.length];if(curEnv===e.n)return e;curEnv=e.n;const c=document.createElement('canvas');c.width=2;c.height=256;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,e.sky[0]);g.addColorStop(.5,e.sky[1]);g.addColorStop(1,e.sky[2]);x.fillStyle=g;x.fillRect(0,0,2,256);scene.background=new THREE.CanvasTexture(c);scene.fog.color.setHex(e.fog);grass.material.color.setHex(e.gr);return e;}
function buildCar(t){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(2.2,.8,4.4),new THREE.MeshLambertMaterial({color:t.c}));b.position.y=.6;b.castShadow=true;g.add(b);const cab=new THREE.Mesh(new THREE.BoxGeometry(1.9,.7,2.2),new THREE.MeshLambertMaterial({color:0x0b1118}));cab.position.set(0,1.2,-.2);g.add(cab);return g;}

function buildBarrier(){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(4.5,1.2,1.6),new THREE.MeshLambertMaterial({color:0xb9bcc0}));b.position.y=.6;g.add(b);return g;}
function buildBlade(){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(6,.3,1.6),new THREE.MeshLambertMaterial({color:0xff3b3b}));b.position.y=1.2;g.add(b);return g;}
const OBS={truck:{f:()=>buildTruck(),hw:2.8,hd:4.5},bus:{f:()=>buildTruck(0xf2f2f2),hw:2.2,hd:5.5},barrier:{f:()=>buildBarrier(),hw:2.5,hd:1},blade:{f:()=>buildBlade(),hw:3,hd:1.2,spin:1},moving:{f:()=>buildTruck(0x2ee6a6),hw:2.8,hd:4.5,move:1},traffic:{f:()=>buildCar(CARS[0]),hw:1.5,hd:2.2,traffic:1}};
function conf(n){const ch=Math.floor((n-1)/100),p=(n-1)/1999;return{rows:Math.floor(5+ch*1.2+p*15),gap:Math.max(3.2,9.5-ch*0.35-p*3),speed:9+ch*0.9+p*12,types:(()=>{let t=['truck'];if(n>30)t.push('bus');if(n>80)t.push('barrier');if(n>200)t.push('moving');if(n>350)t.push('blade');if(n>500)t.push('traffic');return t;})(),move:ch*0.4+p*4}}
let G=null,lvl=1,car=null,menuCar=null,obs=[],steer=0,keys={},curChap=0;
function scr(id){['menu','levels','garage'].forEach(x=>$(x).classList.toggle('on',x===id));document.body.classList.toggle('play',!id);}
window.toMenu=()=>{G=null;if(car)scene.remove(car);car=null;obs.forEach(o=>scene.remove(o.m));obs=[];showMenuCar();scr('menu');upd();};window.toLevels=()=>{G=null;if(car)scene.remove(car);car=null;obs.forEach(o=>scene.remove(o.m));obs=[];showMenuCar();buildTabs();buildLvls(curChap);scr('levels');};window.openLevels=()=>toLevels();window.openGarage=()=>{buildGar();scr('garage');};
function showMenuCar(){if(menuCar)scene.remove(menuCar);menuCar=buildCar(CARS[S.sel]);scene.add(menuCar);applyEnv(S.max);menuCar.position.set(0,0,-2);}
function upd(){$('coinM').textContent='🪙 '+S.coins;if($('coinL'))$('coinL').textContent='🪙 '+S.coins;if($('coinG'))$('coinG').textContent='🪙 '+S.coins;$('sL').textContent=S.max;$('sS').textContent=Object.values(S.stars).reduce((a,b)=>a+b,0);$('sC').textContent=S.owned.length+'/12';}
function buildTabs(){const t=$('tabs');t.innerHTML='';CHAP.forEach((c,i)=>{const b=document.createElement('button');b.className='tab'+(i===curChap?' on':'');b.textContent=c.n+' '+c.l+'-'+(c.l+99);b.onclick=()=>{curChap=i;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');buildLvls(i);};t.appendChild(b);});}
function buildLvls(idx){curChap=idx;const s=CHAP[idx].l;const g=$('levelGrid');g.innerHTML='';for(let i=0;i<100;i++){const n=s+i;if(n>2000)break;const un=n<=S.max;const st=S.stars[n]||0;const env=ENVS[Math.floor((n-1)/(2000/12))%ENVS.length];const b=document.createElement('button');b.className='lv'+(un?'':' lock');b.innerHTML='<span style="font-size:11px">'+env.i+'</span><b>'+(un?n:'🔒')+'</b><em>'+'★'.repeat(st)+'☆'.repeat(3-st)+'</em>';b.onclick=()=>{if(!un)return toast('Finish '+(n-1)+' first');start(n);};g.appendChild(b);}}
function buildGar(){const g=$('gGrid');g.innerHTML='';upd();CARS.forEach((c,i)=>{const own=S.owned.includes(i);const d=document.createElement('div');d.className='carC'+(S.sel===i?' sel':'');d.innerHTML='<div class="sw" style="background:#'+c.c.toString(16).padStart(6,'0')+'"></div><b>'+c.n+'</b><div class="bar"><i style="width:'+Math.round(c.hp/2.5)+'%"></i></div><small>HP '+c.hp+'</small><div class="bar"><i style="width:'+Math.round(c.top/70*100)+'%"></i></div><small>TOP '+c.top+'</small>';const b=document.createElement('button');b.className='btn'+(S.sel===i?' go':'');if(S.sel===i)b.textContent='Selected';else if(own){b.textContent='Use';b.onclick=()=>{S.sel=i;save();showMenuCar();buildGar();toast(c.n+' selected');};}else{b.textContent='🪙 '+c.price;b.onclick=()=>{if(S.coins<c.price)return toast('No coins');S.coins-=c.price;S.owned.push(i);S.sel=i;save();showMenuCar();buildGar();toast('Unlocked '+c.n);};}d.appendChild(b);g.appendChild(d);});}
function start(n){lvl=n;const cf=conf(n);const ev=applyEnv(n);if(menuCar){scene.remove(menuCar);menuCar=null;}if(car)scene.remove(car);obs.forEach(o=>scene.remove(o.m));obs=[];car=buildCar(CARS[S.sel]);scene.add(car);for(let k=0;k<cf.rows;k++){const z=-80-k*(50+Math.random()*20);const gap=cf.gap;const tp=cf.types[Math.floor(Math.random()*cf.types.length)];const def=OBS[tp];const cen=(Math.sin(n*0.7+k)*8+(Math.random()-.5)*4);[-1,1].forEach(s=>{const m=def.f();m.position.set(cen+s*(gap/2+def.hw),0,z);scene.add(m);obs.push({m,hw:def.hw,hd:def.hd,hit:0,spin:def.spin,move:def.move,traffic:def.traffic,baseX:cen+s*(gap/2+def.hw),row:k});});if(k%7==0&&n>400){const m=buildBlade();m.position.set(cen,0,z-15);scene.add(m);obs.push({m,hw:3,hd:1.5,hit:0,spin:1,baseX:cen,row:k});}}G={x:0,z:0,v:0,dmg:0,state:'count',cd:3,fz:-(80+cf.rows*60+100),t:CARS[S.sel],cf,earned:0,shake:0,spin:0};scr(null);$('lvl').textContent='LEVEL '+n+' - '+CHAP[Math.floor((n-1)/100)].n;$('env').textContent=ev.n+' '+ev.i;$('hpb').style.width='100%';$('progb').style.width='0%';}
addEventListener('keydown',e=>keys[e.key]=1);addEventListener('keyup',e=>keys[e.key]=0);$('left').addEventListener('pointerdown',()=>steer=-1);$('right').addEventListener('pointerdown',()=>steer=1);addEventListener('pointerup',()=>steer=0);
$('rR').onclick=()=>{$('result').classList.remove('on');start(lvl);};$('rN').onclick=()=>{$('result').classList.remove('on');start(Math.min(2000,lvl+1));};$('rD').onclick=()=>{const ad=$('ad');const t=$('adT');let s=3;ad.classList.add('on');t.textContent=s;const iv=setInterval(()=>{s--;t.textContent=s;if(s<=0){clearInterval(iv);ad.classList.remove('on');S.coins+=G.earned;save();upd();$('rD').style.display='none';toast('Double!');}},1000);};
function die(){G.state='dead';$('vig').style.opacity=.7;setTimeout(()=>$('vig').style.opacity=0,400);finish(false);}function finish(pass){G.state='done';const r=G.dmg/G.t.hp;let st=0;if(pass)st=r<.15?3:r<.45?2:1;if(pass&&st>(S.stars[lvl]||0))S.stars[lvl]=st;const base=pass?(40+Math.floor(lvl/10)*5+st*15):5;G.earned=base;S.coins+=base;if(pass&&lvl>=S.max&&S.max<2000)S.max=lvl+1;save();upd();$('rT').textContent=pass?(lvl===2000?'🎉 ALL 2000 DONE!':'LEVEL '+lvl+' COMPLETE'):'CRASHED!';$('rS').textContent=pass?'★'.repeat(st)+'☆'.repeat(3-st):'💥';$('rI').textContent=pass?'Damage '+Math.round(r*100)+'% +'+base:'Retry!';$('rN').style.display=pass&&lvl<2000?'block':'none';$('rD').style.display='block';$('result').classList.add('on');}
const clock=new THREE.Clock();function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05);if(G){update(dt,dt);}else{if(menuCar){menuCar.rotation.y+=dt*0.6;}cam.position.set(0,3.5,10);cam.lookAt(0,1,-5);}ren.render(scene,cam);}
function update(dt,real){const st=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0)||steer;if(G.state==='count'){G.cd-=real;$('cd').textContent=G.cd>0?Math.ceil(G.cd):'GO!';$('cd').style.opacity=1;if(G.cd<=0){G.state='run';setTimeout(()=>$('cd').style.opacity=0,400);}}if(G.state==='run'){G.v=Math.min(G.t.top,G.v+dt*18);G.x=Math.max(-16,Math.min(16,G.x+st*dt*14));G.z-=G.v*dt;}obs.forEach(o=>{if(o.spin)o.m.rotation.y+=dt*4;if(o.move)o.m.position.x=o.baseX+Math.sin(performance.now()/400+o.row)*G.cf.move;if(o.traffic)o.m.position.z+=(G.cf.speed*0.3)*dt;if(G.state==='run'&&!o.hit&&Math.abs(o.m.position.x-G.x)<o.hw+1.1&&Math.abs(o.m.position.z-G.z)<o.hd+2.2){o.hit=1;G.dmg+=(G.v+8)*1.5;G.shake=1;G.spin=(Math.random()-.5);$('hpb').style.width=Math.max(0,100-(G.dmg/G.t.hp*100))+'%';if(G.dmg>=G.t.hp)die();}});if(G.state==='run'&&G.z<=G.fz)finish(true);G.shake=Math.max(0,G.shake-real);G.spin*=0.92;if(car){car.position.set(G.x,0,G.z);car.rotation.y=-st*0.15+G.spin;}const prog=Math.min(100,Math.abs(G.z/G.fz*100));$('progb').style.width=prog+'%';const sx=(Math.random()-.5)*G.shake;cam.position.lerp(new THREE.Vector3(G.x*0.6+sx,4.5,G.z+10),0.12);cam.lookAt(G.x,1,G.z-10);cam.fov=66+G.v*0.3;cam.updateProjectionMatrix();sun.position.set(G.x+20,40,G.z+10);sun.target.position.set(G.x,0,G.z-20);}
window.daily=()=>{const now=Date.now();if(now-S.last<86400000)return toast('Tomorrow!');S.last=now;S.coins+=500;save();upd();toast('+500!');};
showMenuCar();upd();buildTabs();buildLvls(0);tick();
</script></body></html>
